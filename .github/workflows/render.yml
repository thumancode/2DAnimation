name: Day01-Render
on: [push]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: node render.js
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -framerate 30 -i frame_%03d.png -c:v libx264 -pix_fmt yuv420p day01.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: day01-video
          path: day01.mp4